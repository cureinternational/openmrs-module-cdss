name: Publish CDSS omod and trigger Cure Bahmni Docker Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  publish-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish omod to GitHub Packages
        run: ./mvnw --no-transfer-progress -B clean deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.CURE_EMR_ORG_ACCESS_TOKEN }}
      - name: Dispatch build_publish_emr in cure-bahmni-docker
        run: gh workflow run build_publish_emr.yml -R cureinternational/cure-bahmni-docker --ref cure-master-snomed
        env:
          GH_TOKEN: ${{ secrets.CURE_EMR_ORG_ACCESS_TOKEN }}
